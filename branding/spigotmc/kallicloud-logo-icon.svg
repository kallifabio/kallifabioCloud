    <line x1="199" y1="254" x2="247" y2="254" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
    <line x1="265" y1="254" x2="311" y2="254" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
