    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22d3ee" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1580" height="500" rx="42" fill="url(#bg)"/>
  <rect x="10" y="10" width="1580" height="500" rx="42" fill="none" stroke="#1e3a8a" stroke-opacity="0.55" stroke-width="2"/>

  <g transform="translate(86,75)">
