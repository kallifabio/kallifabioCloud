    <rect x="0" y="0" width="360" height="360" rx="80" fill="none" stroke="#1e3a8a" stroke-opacity="0.7" stroke-width="2"/>

    <g filter="url(#softGlow)">
      <path d="M78 208c0-27 20-47 47-47 6-22 25-36 48-36 30 0 53 23 54 52 18 2 33 18 33 38 0 21-18 39-39 39H106c-16 0-28-12-28-28 0-7 2-12 0-18z"
            fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="116" y1="178" x2="155" y2="178" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
      <line x1="170" y1="178" x2="205" y2="178" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(500,130)" font-family="Segoe UI, Inter, Arial, sans-serif">
