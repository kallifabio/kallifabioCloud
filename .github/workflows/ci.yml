name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Wrapper Executable
        run: chmod +x ./mvnw

      - name: Smoke Compile
        run: ./mvnw -B -q -DskipTests compile

      - name: Run Tests
        run: ./mvnw -B -q test
